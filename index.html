<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tirage Sécurisé par PIN</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
        background-color: #f0f8ff;
      }
      h1 {
        color: #2c3e50;
      }
      .btn {
        display: block;
        width: 100%;
        max-width: 300px;
        margin: 10px auto;
        padding: 15px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
      }
      .btn:active {
        background-color: #2980b9;
      }
      #resultat {
        margin-top: 20px;
        font-weight: bold;
        font-size: 20px;
        min-height: 50px;
      }
      .cible-done {
        color: #2ecc71;
      }
      .cible-active {
        color: #e74c3c;
      }
    </style>
  </head>
  <body>
    <h1>🎄 Tirage Sécurisé par PIN 🎄</h1>
    <p>
      Clique sur ton prénom et entre ton code PIN personnel pour voir tes
      missions :
    </p>

    <div id="buttons">
      <button class="btn" onclick="montrer('Sandra')">Je suis Sandra</button>
      <button class="btn" onclick="montrer('Bastien')">Je suis Bastien</button>
      <button class="btn" onclick="montrer('Nico')">Je suis Nico</button>
      <button class="btn" onclick="montrer('Lolo')">Je suis Lolo</button>
      <button class="btn" onclick="montrer('Mag')">Je suis Mag</button>
      <button class="btn" onclick="montrer('Yo')">Je suis Yo</button>
      <button class="btn" onclick="montrer('Isa')">Je suis Isa</button>
      <button class="btn" onclick="montrer('Danou')">Je suis Danou</button>
    </div>

    <div id="resultat"></div>

    <script>
      // Codes PIN pour la vérification
      const passwordMap = {
        Sandra: "0202",
        Bastien: "0112",
        Nico: "1804",
        Lolo: "2111",
        Mag: "1209",
        Yo: "1001",
        Isa: "2110",
        Danou: "0308",
      };

      // Données encodées du tirage (Identiques au tirage asymétrique précédent)
      const encodedData =
        "eyJTYW5kcmEiOlsiRGFub3UiLCJMb2xvIl0sIkJhc3RpZW4iOlsiTG9sbyIsIllvIl0sIk5pY28iOlsiQmFzdGllbiIsIk1hZyJdLCJMb2xvIjpbIk1hZyIsIkJhc3RpZW4iXSwiTWFnIjpbIk5pY28iLCJTYW5kcmEiXSwiWW8iOlsiSXNhIiwiTmljbyJdLCJJc2EiOlsiU2FuZHJhIiwiUGFydGljaXBhdGlvbiB0ZXJtaW7pZSJdLCJEYW5vdSI6WyJZbyIsIlBhcnRpY2lwYXRpb24gdGVybWlu6WUiXX0=";
      // Décodage des données
      const decodedJson = atob(encodedData);
      const tirages = JSON.parse(decodedJson);

      function formatCible(cible) {
        if (cible.includes("terminée")) {
          return `<span class="cible-done">${cible}</span>`;
        }
        return `<span class="cible-active">${cible}</span>`;
      }

      function montrer(nom) {
        const res = document.getElementById("resultat");
        const userPin = prompt(`Entre ton code PIN personnel pour ${nom} :`);

        if (userPin === null) {
          // L'utilisateur a annulé
          res.innerHTML = "";
          return;
        }

        // Vérification du mot de passe
        if (userPin === passwordMap[nom]) {
          const cibles = tirages[nom];
          res.innerHTML =
            `✅ ACCÈS AUTORISÉ !<br><br>🎁 **${nom}**, tes missions sont :<br>` +
            `1️⃣ Tirage 1 : ${formatCible(cibles[0])}<br>` +
            `2️⃣ Tirage 2 : ${formatCible(cibles[1])}`;
        } else {
          res.innerHTML = `<span style="color: red;">❌ Code PIN incorrect. Réessaie.</span>`;
        }
      }
    </script>
  </body>
</html>
