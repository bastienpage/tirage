<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tirage au Sort ULTRA-SECRET 8P</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
        background-color: #f0f8ff;
      }
      h1 {
        color: #2c3e50;
      }
      .btn {
        display: block;
        width: 100%;
        max-width: 300px;
        margin: 10px auto;
        padding: 15px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
      }
      .btn:active {
        background-color: #2980b9;
      }
      #resultat {
        margin-top: 20px;
        font-weight: bold;
        font-size: 20px;
        color: #e74c3c;
        min-height: 50px;
      }
    </style>
  </head>
  <body>
    <h1>🎄 Tirage Secret - 8 Participants 🎄</h1>
    <p>Clique sur ton prénom pour voir tes 2 missions :</p>

    <div id="buttons">
      <button class="btn" onclick="montrer('Sandra')">Je suis Sandra</button>
      <button class="btn" onclick="montrer('Bastien')">Je suis Bastien</button>
      <button class="btn" onclick="montrer('Nico')">Je suis Nico</button>
      <button class="btn" onclick="montrer('Lolo')">Je suis Lolo</button>
      <button class="btn" onclick="montrer('Mag')">Je suis Mag</button>
      <button class="btn" onclick="montrer('Yo')">Je suis Yo</button>
      <button class="btn" onclick="montrer('Isa')">Je suis Isa</button>
      <button class="btn" onclick="montrer('Danou')">Je suis Danou</button>
    </div>

    <div id="resultat"></div>

    <script>
      // ATTENTION BASTIEN : Cette variable contient les résultats encodés pour 8 personnes. Ne lis pas !
      const encodedData =
        "eyJTYW5kcmEiOlsiTmljbyIsIkxvbG8iXSwiTmljbyI6WyJNYWciLCJZbyJdLCJNYWciOlsiSXNhIiwiRGFub3UiXSwiSXNhIjpbIkJhc3RpZW4iLCJNYWciXSwiQmFzdGllbiI6WyJMb2xvIiwiSXNhIl0sIkxvbG8iOlsiWW8iLCJCYXN0aWVuIl0sIllvIjpbIkRhbm91IiwiU2FuZHJhIl0sIkRhbm91IjpbIlNhbmRyYSIsIk5pY28iXX0=";

      // Décodage des données (atob pour Base64, puis JSON.parse)
      const decodedJson = atob(encodedData);
      const tirages = JSON.parse(decodedJson);

      function montrer(nom) {
        const res = document.getElementById("resultat");
        // Double vérification pour éviter les clics accidentels
        if (
          confirm(
            "Es-tu bien " + nom + " ? (Attention, le résultat va s'afficher !)"
          )
        ) {
          const cibles = tirages[nom];
          res.innerHTML = `🎁 **${nom}**, tes cibles sont :<br>1️⃣ Tirage 1 : **${cibles[0]}**<br>2️⃣ Tirage 2 : **${cibles[1]}**`;
        }
      }
    </script>
  </body>
</html>
